<form action="">
<table>
    <tr>
    <td align="left">
<label for="fname">First Name </label></td>

    </tr>

        <td align="left">

 <label for="address">Address </label><br></td>

        </td>
    </tr>
    <tr>

 <input type="submit"value="submit">
 <input type="reset"value="reset"></td>

</table>
 </form>
