<h1 align="center"><u>Registration form</u></h1>
<form >
<table width="90%" cellpadding="8" align="center">
    <tr>
    <td>
<label for="fname">First Name </label></td>
<td><input type="text" name="fname" id="fname" size="25"></td>
</tr>
    <tr>
        <td>
<label for="lname">Last Name </label></td>
<td><input type="text" name="lname" id="lname" size="25"></td>
</tr>
    <tr>
        <td>
<label for="nname">Nick Name </label></td>
<td><input type="text" name="nname" id="nname" size="25"></td>
    </tr>
    <tr>
        <td>
<label for="e-mail">e-mail </label></td>
<td><input type="email" name="e-mail" id="e-mail" size="25"></td>
</tr>
    <tr>
        <td>
<label for="password">Password</label></td>
<td><input type="password" name="password" id="password" size="25"></td>
</tr>
    <tr>
        <td>
<label for="date of birth">Date of birth </label></td>
<td><input type="date" name="date of birth" id="date of birth"></td>
</tr>
    <tr>
        <td>
<label for="gender">Gender</label></td>
<td><input type="radio"name="gender"value="Male" >Male
<input type="radio"name="gender"value="Female" >Female
<input type="radio"name="gender"value="others">others</td>
</tr>
    <tr>
        <td align="left">
<label for="mobile">Mobile </label></td>
<td><input type="tel" name="mobile" id="mobile" size="25"></td>
</tr>
    <tr>
        <td align="left">
 <label for="address">Address </label><br></td>
<td><textarea name="address" id="address" rows="4" cols="30"></textarea><br>
        </td>
    </tr>
    <tr>
        <td></td>
        <td>
 <input type="submit"value="submit">
 <input type="reset"value="reset"></td>
    </tr>
</table>
 </form>
